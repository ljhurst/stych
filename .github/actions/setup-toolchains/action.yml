---
name: Set up toolchains
description: Install only the toolchains a project asks for

inputs:
  node-version-file:
    description: Install Node from this version file
    default: ""
  go-version-file:
    description: Install Go from this version file (e.g. go.mod)
    default: ""
  setup-uv:
    description: Install uv; it fetches the Python version a build asks for
    default: "false"
  terraform-version:
    description: Install this Terraform version
    default: ""

runs:
  using: composite
  steps:
    - if: inputs.node-version-file != ''
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
      with:
        node-version-file: ${{ inputs.node-version-file }}

    - if: inputs.go-version-file != ''
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
      with:
        go-version-file: ${{ inputs.go-version-file }}

    - if: inputs.setup-uv == 'true'
      uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2

    - if: inputs.terraform-version != ''
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
      with:
        terraform_version: ${{ inputs.terraform-version }}
        terraform_wrapper: false

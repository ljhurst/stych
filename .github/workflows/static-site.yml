---
name: Static site

# yamllint disable-line rule:truthy
on:
  workflow_call:
    inputs:
      plan-role-arn:
        description: Read-only role the PR preview assumes
        type: string
        required: true
      apply-role-arn:
        description: Role the deploy on the default branch assumes
        type: string
        required: true
      bucket:
        description: S3 bucket the site is synced to, at its root
        type: string
        required: true
      site-dir:
        description: Directory synced to the bucket root with --delete
        type: string
        default: site
      build-command:
        description: Command run from the repo root that leaves the site in site-dir
        type: string
        default: ""
      node-version-file:
        description: Set to install Node from this version file before building
        type: string
        default: ""
      distribution-id:
        description: CloudFront distribution to invalidate after deploying
        type: string
        default: ""
      aws-region:
        type: string
        default: us-east-1

defaults:
  run:
    shell: bash

env:
  SITE_DIR: ${{ inputs.site-dir }}
  BUCKET: ${{ inputs.bucket }}
  BUILD_COMMAND: ${{ inputs.build-command }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: ljhurst/stych/.github/actions/setup-toolchains@feat/static-site-and-checks
        with:
          node-version-file: ${{ inputs.node-version-file }}

      - name: Build
        if: inputs.build-command != ''
        run: eval "$BUILD_COMMAND"

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: site
          path: ${{ inputs.site-dir }}
          if-no-files-found: error
          include-hidden-files: true

  preview:
    # Fork PRs never reach the plan role.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    concurrency:
      group: site-preview-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: site
          path: ${{ inputs.site-dir }}

      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ inputs.plan-role-arn }}
          role-session-name: stych-site-preview-${{ github.run_id }}
          aws-region: ${{ inputs.aws-region }}

      - name: Preview the sync
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          aws s3 sync "$SITE_DIR" "s3://$BUCKET" --delete --dryrun --no-progress > "$RUNNER_TEMP/sync.log"
          uploads=$(grep -c '^(dryrun) upload:' "$RUNNER_TEMP/sync.log" || true)
          deletes=$(grep '^(dryrun) delete:' "$RUNNER_TEMP/sync.log" | sed 's/^(dryrun) delete: /> - /' || true)
          marker="<!-- stych:site-preview:$BUCKET -->"
          body="$RUNNER_TEMP/comment.md"
          {
            echo "$marker"
            echo "### Site preview for \`$BUCKET\`"
            echo
            if [ -n "$deletes" ]; then
              echo "> [!WARNING]"
              echo "> Deploying this deletes $(grep -c . <<< "$deletes") objects from the bucket:"
              echo "$deletes"
              echo
            fi
            echo "**$uploads to upload, $(grep -c . <<< "$deletes") to delete.**"
            echo
            echo "<details><summary>Full sync preview</summary>"
            echo
            echo '```'
            head -c 60000 "$RUNNER_TEMP/sync.log"
            echo '```'
            echo "</details>"
          } > "$body"
          cat "$body" >> "$GITHUB_STEP_SUMMARY"
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@"$body" > /dev/null
          else
            gh pr comment "$PR" --repo "$REPO" --body-file "$body"
          fi

  deploy:
    if: >-
      github.event_name == 'push' &&
      github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: site-deploy-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: site
          path: ${{ inputs.site-dir }}

      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ inputs.apply-role-arn }}
          role-session-name: stych-site-deploy-${{ github.run_id }}
          aws-region: ${{ inputs.aws-region }}

      - name: Sync
        run: |
          aws s3 sync "$SITE_DIR" "s3://$BUCKET" --delete --no-progress | tee "$RUNNER_TEMP/sync.log"
          {
            echo "### Site deploy to \`$BUCKET\`"
            echo
            echo "**$(grep -c '^upload:' "$RUNNER_TEMP/sync.log" || true) uploaded, $(grep -c '^delete:' "$RUNNER_TEMP/sync.log" || true) deleted.**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Invalidate CloudFront
        if: inputs.distribution-id != ''
        env:
          DISTRIBUTION_ID: ${{ inputs.distribution-id }}
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*" > /dev/null

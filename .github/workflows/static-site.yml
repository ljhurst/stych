---
name: Static site

# yamllint disable-line rule:truthy
on:
  workflow_call:
    inputs:
      plan-role-arn:
        description: Read-only role the PR preview assumes
        type: string
        required: true
      apply-role-arn:
        description: Role the deploy on the default branch assumes
        type: string
        required: true
      bucket:
        description: S3 bucket the site is synced to, at its root
        type: string
        required: true
      site-dir:
        description: Directory synced to the bucket root with --delete
        type: string
        default: site
      build-command:
        description: Command run from the repo root that leaves the site in site-dir
        type: string
        default: ""
      node-version-file:
        description: Set to install Node from this version file before building
        type: string
        default: ""
      distribution-id:
        description: CloudFront distribution to invalidate after deploying
        type: string
        default: ""
      preview-bucket:
        description: Bucket pull request previews are deployed to, under <repo>/pr-<number>/
        type: string
        default: lj-previews
      preview-domain:
        description: Parent domain previews are served from, as <repo>-pr-<number>.<domain>
        type: string
        default: preview.bylukehurst.com
      preview-kvs-arn:
        description: Key value store the preview distribution reads each project's Content-Security-Policy from
        type: string
        default: arn:aws:cloudfront::755958650241:key-value-store/b900fdbb-7678-4ca8-8268-0164a56e8e6b
      smoke-path:
        description: Path that must answer 200 on the preview before it is reported as ready
        type: string
        default: /
      aws-region:
        type: string
        default: us-east-1

defaults:
  run:
    shell: bash

env:
  BUILD_COMMAND: ${{ inputs.build-command }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: ljhurst/stych/.github/actions/setup-toolchains@v1
        with:
          node-version-file: ${{ inputs.node-version-file }}

      - name: Build
        if: inputs.build-command != ''
        run: eval "$BUILD_COMMAND"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: site
          path: ${{ inputs.site-dir }}
          if-no-files-found: error
          include-hidden-files: true

  preview:
    # Fork PRs never reach the plan role.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      deployments: write
    concurrency:
      group: site-preview-${{ github.repository }}-${{ github.event.number }}
      cancel-in-progress: true
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
      REPO_NAME: ${{ github.event.repository.name }}
      PREVIEW_DOMAIN: ${{ inputs.preview-domain }}
      PREVIEW_BUCKET: ${{ inputs.preview-bucket }}
      PREVIEW_KVS_ARN: ${{ inputs.preview-kvs-arn }}
      DISTRIBUTION_ID: ${{ inputs.distribution-id }}
      SMOKE_PATH: ${{ inputs.smoke-path }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: site
          path: ${{ inputs.site-dir }}

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: ${{ inputs.plan-role-arn }}
          role-session-name: stych-site-preview-${{ github.run_id }}
          aws-region: ${{ inputs.aws-region }}

      - name: Start the deployment
        run: |
          {
            echo "PREVIEW_URL=https://$REPO_NAME-pr-$PR.$PREVIEW_DOMAIN"
            echo "PREVIEW_PREFIX=s3://$PREVIEW_BUCKET/$REPO_NAME/pr-$PR/"
          } >> "$GITHUB_ENV"
          id=$(jq -n --arg ref "$SHA" --arg task "pr-$PR" '{
              ref: $ref, task: $task, environment: "preview", description: "Pull request preview",
              auto_merge: false, required_contexts: [], transient_environment: true, production_environment: false
            }' | gh api -X POST "repos/$GITHUB_REPOSITORY/deployments" --input - --jq .id)
          echo "DEPLOYMENT_ID=$id" >> "$GITHUB_ENV"
          gh api -X POST "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" -f state=in_progress > /dev/null

      - id: sync
        uses: ljhurst/stych/.github/actions/sync-site@v1
        with:
          site-dir: ${{ inputs.site-dir }}
          destination: ${{ env.PREVIEW_PREFIX }}

      - name: Publish the Content-Security-Policy
        if: inputs.distribution-id != ''
        run: |
          policy_id=$(aws cloudfront get-distribution --id "$DISTRIBUTION_ID" \
            --query 'Distribution.DistributionConfig.DefaultCacheBehavior.ResponseHeadersPolicyId' --output text)
          query=ResponseHeadersPolicy.ResponseHeadersPolicyConfig
          query=$query.SecurityHeadersConfig.ContentSecurityPolicy.ContentSecurityPolicy
          csp=$(aws cloudfront get-response-headers-policy --id "$policy_id" \
            --query "$query" \
            --output text)
          if [ "$csp" = None ] || [ -z "$csp" ]; then
            echo "csp=none" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ "${#csp}" -gt 1024 ]; then
            echo "::warning::The production Content-Security-Policy is over the 1024 byte limit of the preview store"
            echo "csp=too-long" >> "$GITHUB_ENV"
            exit 0
          fi
          for attempt in 1 2 3 4 5; do
            etag=$(aws cloudfront-keyvaluestore describe-key-value-store \
              --kvs-arn "$PREVIEW_KVS_ARN" --query ETag --output text)
            if aws cloudfront-keyvaluestore put-key --kvs-arn "$PREVIEW_KVS_ARN" \
              --key "$REPO_NAME" --value "$csp" --if-match "$etag" > /dev/null; then
              printf '%s' "$csp" > "$RUNNER_TEMP/csp.txt"
              echo "csp=published" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "::error::Could not publish the Content-Security-Policy"
          exit 1

      - name: Smoke check
        run: |
          want=
          [ "${csp:-}" = published ] && want=$(cat "$RUNNER_TEMP/csp.txt")
          ready=0
          for _ in $(seq 1 12); do
            code=$(curl -s -o /dev/null -D "$RUNNER_TEMP/headers" -w '%{http_code}' "$PREVIEW_URL$SMOKE_PATH" || true)
            if [ "$code" = 200 ]; then
              ready=1
              served=$(tr -d '\r' < "$RUNNER_TEMP/headers" | sed -n 's/^[Cc]ontent-[Ss]ecurity-[Pp]olicy: //p')
              if [ -z "$want" ]; then
                exit 0
              elif [ "$served" = "$want" ]; then
                echo "csp=applied" >> "$GITHUB_ENV"
                exit 0
              fi
            fi
            echo "Waiting for $PREVIEW_URL$SMOKE_PATH (got $code)"
            sleep 5
          done
          if [ "$ready" = 1 ]; then
            echo "::warning::The preview answers 200 but does not serve the published Content-Security-Policy yet"
            echo "csp=not-served-yet" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "::error::$PREVIEW_URL$SMOKE_PATH did not answer 200"
          exit 1

      - id: diff
        name: Preview the production deploy
        uses: ljhurst/stych/.github/actions/sync-site@v1
        with:
          site-dir: ${{ inputs.site-dir }}
          destination: s3://${{ inputs.bucket }}
          dry-run: "true"

      - name: Mark the deployment ready
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/deployments/$DEPLOYMENT_ID/statuses" \
            -f state=success -f environment_url="$PREVIEW_URL" \
            -f log_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null

      - name: Mark the deployment failed
        if: failure() && env.DEPLOYMENT_ID != ''
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/deployments/$DEPLOYMENT_ID/statuses" \
            -f state=failure -f log_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null

      - name: Comment on the pull request
        if: success()
        env:
          BUCKET: ${{ inputs.bucket }}
          UPLOADS: ${{ steps.diff.outputs.uploaded }}
          DELETES: ${{ steps.diff.outputs.deleted }}
          DIFF_LOG: ${{ steps.diff.outputs.log }}
        run: |
          deletes=$(grep -E '^\(dryrun\) delete:' "$DIFF_LOG" | sed 's/^(dryrun) delete: /> - /' || true)
          marker="<!-- stych:site-preview:$BUCKET -->"
          body="$RUNNER_TEMP/comment.md"
          {
            echo "$marker"
            echo "### Preview for \`$BUCKET\`"
            echo
            echo "**[$PREVIEW_URL]($PREVIEW_URL)**"
            echo
            echo "Content-Security-Policy: ${csp:-not checked}"
            echo
            echo "Merging deploys to production: **$UPLOADS to upload, $DELETES to delete.**"
            if [ -n "$deletes" ]; then
              echo
              echo "> [!WARNING]"
              echo "> Deploying this deletes $DELETES objects from the bucket:"
              echo "$deletes"
            fi
            echo
            echo "<details><summary>Full sync preview</summary>"
            echo
            echo '```'
            head -c 60000 "$DIFF_LOG"
            echo '```'
            echo "</details>"
          } > "$body"
          cat "$body" >> "$GITHUB_STEP_SUMMARY"
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@"$body" > /dev/null
          else
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file "$body"
          fi

  deploy:
    if: >-
      github.event_name == 'push' &&
      github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: site-deploy-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: site
          path: ${{ inputs.site-dir }}

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: ${{ inputs.apply-role-arn }}
          role-session-name: stych-site-deploy-${{ github.run_id }}
          aws-region: ${{ inputs.aws-region }}

      - uses: ljhurst/stych/.github/actions/sync-site@v1
        with:
          site-dir: ${{ inputs.site-dir }}
          destination: s3://${{ inputs.bucket }}

      - name: Invalidate CloudFront
        if: inputs.distribution-id != ''
        env:
          DISTRIBUTION_ID: ${{ inputs.distribution-id }}
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*" > /dev/null
